<!-- Frontend Script -->
    <script>
        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const jobTarget = document.getElementById('jobTarget').value;
            const location = document.getElementById('location').value;
            const numResults = document.getElementById('numResults').value;

            const submitBtn = document.getElementById('submitBtn');
            const loader = document.getElementById('loader');
            const emptyState = document.getElementById('emptyState');
            const resultsGrid = document.getElementById('resultsGrid');
            const resultsCount = document.getElementById('resultsCount');

            // UI Loading state
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            loader.classList.remove('hidden');
            emptyState.classList.add('hidden');
            resultsGrid.innerHTML = '';
            resultsCount.textContent = 'Processando...';

            try {
                // CHAMA A SUA ROTA EXATA: /run-search
                const response = await fetch('/run-search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        job_target: jobTarget,
                        location: location,
                        max_results: parseInt(numResults) // O seu backend espera max_results
                    })
                });

                if (!response.ok) {
                    throw new Error(`Falha ao comunicar com o servidor (Status: ${response.status}).`);
                }

                const data = await response.json();
                loader.classList.add('hidden');

                // Lê o array de candidates do seu backend
                if (!data.candidates || data.candidates.length === 0) {
                    emptyState.classList.remove('hidden');
                    resultsCount.textContent = '0 gerados';
                    return;
                }

                resultsCount.textContent = `${data.candidates.length} gerado(s)`;

                data.candidates.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'bg-slate-950/80 border border-slate-800/80 rounded-2xl p-6 flex flex-col justify-between shadow-lg hover:border-emerald-500/50 transition-all group';
                    
                    card.innerHTML = `
                        <div class="space-y-3">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                    SCORE: ${item.score}/10
                                </span>
                                <span class="text-xs text-slate-400 flex items-center gap-1 font-medium">
                                    <span class="w-2 h-2 rounded-full bg-emerald-400"></span> ${item.cnh_status}
                                </span>
                            </div>
                            <h4 class="font-bold text-slate-100 text-base group-hover:text-emerald-400 transition-colors line-clamp-2 uppercase">
                                ${item.name_or_snippet || 'Campanha de Recrutamento Ativo'}
                            </h4>
                            <p class="text-xs text-slate-400 line-clamp-3 leading-relaxed">
                                Vaga: ${item.job_target}<br>
                                Local: ${item.location}
                            </p>
                        </div>
                        <div class="pt-6 mt-4 border-t border-slate-800/80">
                            <!-- Link usando o whatsapp_link que o seu backend gera -->
                            <a href="${item.whatsapp_link}" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold py-2.5 px-4 rounded-xl text-xs flex items-center justify-center gap-2 transition-all shadow-md shadow-emerald-600/20">
                                <span>💬</span> Enviar Link da Michele
                            </a>
                        </div>
                    `;
                    resultsGrid.appendChild(card);
                });

            } catch (err) {
                loader.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.innerHTML = `<p class="text-red-400 text-sm">Erro ao gerar kits: ${err.message}</p>`;
                resultsCount.textContent = 'Erro';
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });
    </script>
